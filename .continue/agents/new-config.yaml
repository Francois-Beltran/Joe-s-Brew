name: Qwen Local + Scan
version: 1.0.0
schema: v1

models:
  - name: Qwen2.5-Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - chat
      - edit
      - apply

  - name: Qwen2.5-Coder 1.5B Autocomplete
    provider: ollama
    model: qwen2.5-coder:1.5b
    roles:
      - autocomplete

  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text
    roles:
      - embed

# Custom Rules / Commands
rules:
  - "You are a helpful, precise, and honest coding assistant."

slashCommands:
  - name: scan
    description: Scan the project for syntax errors, import issues, and bugs
    prompt: |
      @codebase Please perform a full project scan and check for:

      1. Syntax errors
      2. Import / module errors
      3. Unused imports
      4. Obvious runtime bugs or broken logic
      5. Any other issues

      Focus on recently modified files and open files if possible.
      List findings clearly with file paths and line numbers.
      If everything looks good, say so.